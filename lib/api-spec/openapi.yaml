openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: AURIX journey, incident, contact, responder, and ResponseChain API
servers:
  - url: /api
    description: Same-origin API
tags:
  - name: health
  - name: auth
  - name: journeys
  - name: incidents
  - name: contacts
  - name: responders
  - name: demo
  - name: campus
  - name: authority
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Check API and database status
      responses:
        "200":
          description: API and database status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get the current signed-in or development demo session
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Create or update the signed-in user's AURIX profile
      description: The server derives identity and role from the verified Clerk account and server-side access configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationInput"
      responses:
        "200":
          description: Profile created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /demo/seed:
    post:
      operationId: seedDemoData
      tags: [demo]
      summary: Seed the synthetic development dataset
      description: Development only. Creates fixed synthetic users, a journey, an incident, a responder, a trusted contact, and ResponseChain events.
      responses:
        "200":
          description: Demo seed status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoSeedResult"
        "404":
          description: Not available outside development
  /journeys:
    post:
      operationId: createJourney
      tags: [journeys]
      summary: Create a journey for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JourneyInput"
      responses:
        "201":
          description: Journey created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /journeys/active:
    get:
      operationId: getActiveJourney
      tags: [journeys]
      summary: Get the caller's active journey or a contact-authorized shared journey
      responses:
        "200":
          description: Active journey, if visible to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveJourneyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /journeys/{journeyId}/status:
    patch:
      operationId: updateJourneyStatus
      tags: [journeys]
      summary: Update a journey's status
      parameters:
        - $ref: "#/components/parameters/JourneyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JourneyStatusUpdate"
      responses:
        "200":
          description: Updated journey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        "403":
          $ref: "#/components/responses/Forbidden"
  /journeys/{journeyId}/location:
    patch:
      operationId: updateJourneyLocation
      tags: [journeys]
      summary: Save a simulated or user-provided journey location
      parameters:
        - $ref: "#/components/parameters/JourneyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JourneyLocationUpdate"
      responses:
        "200":
          description: Updated journey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        "403":
          $ref: "#/components/responses/Forbidden"
  /journeys/{journeyId}/sharing:
    patch:
      operationId: updateJourneySharing
      tags: [journeys]
      summary: Change whether verified trusted contacts can view journey context
      parameters:
        - $ref: "#/components/parameters/JourneyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JourneySharingUpdate"
      responses:
        "200":
          description: Updated journey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        "403":
          $ref: "#/components/responses/Forbidden"
  /emergency-contacts:
    get:
      operationId: getEmergencyContacts
      tags: [contacts]
      summary: List the caller's trusted contacts
      responses:
        "200":
          description: Trusted contacts owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyContactsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createEmergencyContact
      tags: [contacts]
      summary: Add a trusted contact invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyContactInput"
      responses:
        "201":
          description: Trusted contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyContact"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /incidents:
    post:
      operationId: createIncident
      tags: [incidents]
      summary: Create a simulated incident owned by the caller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentInput"
      responses:
        "201":
          description: Incident created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentView"
        "403":
          $ref: "#/components/responses/Forbidden"
  /incidents/active:
    get:
      operationId: getActiveIncidents
      tags: [incidents]
      summary: List incidents the caller is authorized to see
      description: Authority users see authorized incident records; responders receive actionable details without victim identity; trusted contacts only see shared incidents.
      responses:
        "200":
          description: Authorized active incidents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveIncidentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /incidents/{incidentId}/accept:
    post:
      operationId: acceptIncident
      tags: [incidents]
      summary: Assign an active incident to the verified responder
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentView"
        "403":
          $ref: "#/components/responses/Forbidden"
  /incidents/{incidentId}/events:
    post:
      operationId: createResponseEvent
      tags: [incidents]
      summary: Append an authorized ResponseChain audit event
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseEventInput"
      responses:
        "201":
          description: Recorded event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEvent"
        "403":
          $ref: "#/components/responses/Forbidden"
  /incidents/{incidentId}/resolve:
    post:
      operationId: resolveIncident
      tags: [incidents]
      summary: Resolve an incident and append a resolution event
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveIncidentInput"
      responses:
        "200":
          description: Resolved incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentView"
        "403":
          $ref: "#/components/responses/Forbidden"
  /responders:
    post:
      operationId: registerResponder
      tags: [responders]
      summary: Create or update the signed-in verified responder's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponderInput"
      responses:
        "200":
          description: Responder profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Responder"
        "403":
          $ref: "#/components/responses/Forbidden"
  /responders/available:
    get:
      operationId: getAvailableResponders
      tags: [responders]
      summary: List verified responders available for coordination
      responses:
        "200":
          description: Available responder summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableRespondersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /responders/status:
    patch:
      operationId: updateResponderStatus
      tags: [responders]
      summary: Update the caller's responder availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponderStatusUpdate"
      responses:
        "200":
          description: Updated responder profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Responder"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campus/overview:
    get:
      operationId: getCampusOverview
      tags: [campus]
      summary: Get synthetic campus zones and privacy-safe local safety context
      responses:
        "200":
          description: Campus zones, aggregate active incidents, and responder coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusOverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /campus/reports:
    get:
      operationId: getCampusReports
      tags: [campus]
      summary: List campus reports visible to the caller
      responses:
        "200":
          description: Reports owned by the user or reviewable by authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusReportsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createCampusReport
      tags: [campus]
      summary: Submit a synthetic campus safety report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampusReportInput"
      responses:
        "201":
          description: Report submitted for responsible review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /campus/reports/{reportId}/verification:
    patch:
      operationId: updateCampusReportVerification
      tags: [campus]
      summary: Review and update a campus report as an authority user
      parameters:
        - $ref: "#/components/parameters/CampusReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampusReportReview"
      responses:
        "200":
          description: Updated report review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusReport"
        "403":
          $ref: "#/components/responses/Forbidden"
  /authority/incidents:
    get:
      operationId: getAuthorityIncidents
      tags: [authority]
      summary: List active and resolved incidents for the authority review board
      responses:
        "200":
          description: Full incident timeline and verification state for authorized authority users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveIncidentsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /incidents/{incidentId}/verification:
    patch:
      operationId: updateIncidentVerification
      tags: [incidents]
      summary: Update incident verification state as an authority user
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentVerificationUpdate"
      responses:
        "200":
          description: Updated incident with its audit history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentView"
        "403":
          $ref: "#/components/responses/Forbidden"
  /incidents/{incidentId}/evidence:
    get:
      operationId: getIncidentEvidence
      tags: [incidents]
      summary: List private evidence metadata for the owner or authority
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Private evidence metadata (no uploaded media bytes)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentEvidenceResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createIncidentEvidence
      tags: [incidents]
      summary: Save a private synthetic evidence entry for the incident owner
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentEvidenceInput"
      responses:
        "201":
          description: Evidence metadata saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentEvidence"
        "403":
          $ref: "#/components/responses/Forbidden"
  /incidents/{incidentId}/nearby-response:
    post:
      operationId: respondToNearbySafetyRequest
      tags: [incidents]
      summary: Record an anonymous demo response to a nearby safety request
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NearbyAssistanceInput"
      responses:
        "200":
          description: Anonymous response recorded without exposing incident identity or exact location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearbyAssistanceResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  parameters:
    JourneyId:
      name: journeyId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CampusReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: The caller is not authorized for this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [connected, unavailable]
        demoData:
          type: boolean
        checkedAt:
          type: string
          format: date-time
      required: [status, database, demoData, checkedAt]
    UserRole:
      type: string
      enum: [user, emergency_contact, responder, authority]
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: [string, "null"]
        role:
          $ref: "#/components/schemas/UserRole"
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, phone, role, createdAt]
    UserRegistrationInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: [string, "null"]
          maxLength: 40
      required: [name]
      additionalProperties: false
    AuthSession:
      type: object
      properties:
        signedIn:
          type: boolean
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        demoMode:
          type: boolean
      required: [signedIn, user, demoMode]
    GeoPoint:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        label:
          type: string
          maxLength: 200
      required: [latitude, longitude]
      additionalProperties: false
    RouteSnapshot:
      type: object
      properties:
        origin:
          type: string
          maxLength: 200
        destination:
          type: string
          maxLength: 200
        points:
          type: array
          items:
            $ref: "#/components/schemas/GeoPoint"
      required: [origin, destination]
      additionalProperties: false
    JourneyStatus:
      type: string
      enum: [planned, active, paused, arrived, cancelled]
    Journey:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        destination:
          type: string
        vehicleNumber:
          type: [string, "null"]
        driverName:
          type: [string, "null"]
        startTime:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/JourneyStatus"
        expectedRoute:
          anyOf:
            - $ref: "#/components/schemas/RouteSnapshot"
            - type: "null"
        currentLocation:
          anyOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        shareWithContacts:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, userId, destination, vehicleNumber, driverName, startTime, status, expectedRoute, currentLocation, riskLevel, shareWithContacts, createdAt]
    JourneyInput:
      type: object
      properties:
        destination:
          type: string
          minLength: 1
          maxLength: 200
        vehicleNumber:
          type: [string, "null"]
          maxLength: 40
        driverName:
          type: [string, "null"]
          maxLength: 120
        expectedRoute:
          $ref: "#/components/schemas/RouteSnapshot"
        currentLocation:
          $ref: "#/components/schemas/GeoPoint"
        shareWithContacts:
          type: boolean
      required: [destination, expectedRoute]
      additionalProperties: false
    ActiveJourneyResponse:
      type: object
      properties:
        journey:
          anyOf:
            - $ref: "#/components/schemas/Journey"
            - type: "null"
      required: [journey]
    JourneyStatusUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/JourneyStatus"
      required: [status]
      additionalProperties: false
    JourneyLocationUpdate:
      type: object
      properties:
        location:
          $ref: "#/components/schemas/GeoPoint"
      required: [location]
      additionalProperties: false
    JourneySharingUpdate:
      type: object
      properties:
        shareWithContacts:
          type: boolean
      required: [shareWithContacts]
      additionalProperties: false
    EmergencyContact:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        email:
          type: [string, "null"]
          format: email
        phone:
          type: string
        relationship:
          type: string
        verified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, userId, name, email, phone, relationship, verified, createdAt]
    EmergencyContactInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 4
          maxLength: 40
        relationship:
          type: string
          minLength: 1
          maxLength: 80
      required: [name, email, phone, relationship]
      additionalProperties: false
    EmergencyContactsResponse:
      type: object
      properties:
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/EmergencyContact"
      required: [contacts]
    RiskLevel:
      type: string
      enum: [low, medium, high, critical]
    IncidentType:
      type: string
      enum: [route_deviation, unexpected_stop, user_request, no_response, manual_report, user_feels_unsafe, being_followed, being_surrounded, manual_sos, new_incident]
    VerificationStatus:
      type: string
      enum: [not_started, pending, confirmed_safe, help_requested, no_response, reported, under_verification, verified, unconfirmed, resolved]
    ResponseStatus:
      type: string
      enum: [open, verification_pending, responder_assigned, help_reached, resolved]
    ResponseEvent:
      type: object
      properties:
        id:
          type: integer
        incidentId:
          type: integer
        eventType:
          type: string
        actorId:
          type: [integer, "null"]
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
      required: [id, incidentId, eventType, actorId, timestamp, details]
    RiskSignalCode:
      type: string
      enum: [route_deviation, unexpected_stop, contextual_location, safety_request, manual_sos, no_response, multiple_requests, unusual_journey]
    RiskSignal:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/RiskSignalCode"
        label:
          type: string
        points:
          type: integer
      required: [code, label, points]
    IncidentContext:
      type: string
      enum: [campus, public_space]
    DetectionMode:
      type: string
      enum: [journey_signal, new_incident_no_history, user_safety_request, manual_sos, campus_report]
    CampusZoneType:
      type: string
      enum: [girls_hostel, academic_block, parking_area, campus_gate, isolated_pathway, construction_zone, common_area, other]
    CampusAssistance:
      type: string
      enum: [available, limited, unknown]
    LastSafeLocation:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
        label:
          type: string
        recordedAt:
          type: string
          format: date-time
        journeyId:
          type: integer
      required: [latitude, longitude, recordedAt, journeyId]
      additionalProperties: false
    IncidentSubject:
      type: object
      description: Returned only to the owner, their verified and authorized contact, or an authority user.
      properties:
        name:
          type: string
        phone:
          type: [string, "null"]
      required: [name, phone]
    IncidentView:
      type: object
      properties:
        id:
          type: integer
        journeyId:
          type: [integer, "null"]
        incidentType:
          $ref: "#/components/schemas/IncidentType"
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
        riskSignals:
          type: array
          items:
            $ref: "#/components/schemas/RiskSignal"
        latitude:
          type: number
        longitude:
          type: number
        detectedAt:
          type: string
          format: date-time
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
        responseStatus:
          $ref: "#/components/schemas/ResponseStatus"
        resolvedAt:
          type: [string, "null"]
          format: date-time
        destination:
          type: [string, "null"]
        contextType:
          $ref: "#/components/schemas/IncidentContext"
        campusZoneId:
          type: [integer, "null"]
        campusZoneName:
          type: [string, "null"]
        locationLabel:
          type: [string, "null"]
        detectionMode:
          $ref: "#/components/schemas/DetectionMode"
        historicalReportsAvailable:
          type: [boolean, "null"]
        lastSafeLocation:
          anyOf:
            - $ref: "#/components/schemas/LastSafeLocation"
            - type: "null"
        assignedResponderId:
          type: [integer, "null"]
        assignedResponderType:
          type: [string, "null"]
        victim:
          anyOf:
            - $ref: "#/components/schemas/IncidentSubject"
            - type: "null"
        events:
          type: array
          items:
            $ref: "#/components/schemas/ResponseEvent"
      required: [id, journeyId, incidentType, riskLevel, riskScore, riskSignals, latitude, longitude, detectedAt, verificationStatus, responseStatus, resolvedAt, destination, contextType, campusZoneId, campusZoneName, locationLabel, detectionMode, historicalReportsAvailable, lastSafeLocation, assignedResponderId, assignedResponderType, victim, events]
    IncidentInput:
      type: object
